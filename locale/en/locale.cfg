[mod-name]
WePlayLongHaulLogistics=WePlay: Long Haul Logistics

[mod-description]
WePlayLongHaulLogistics=A logistics network with no coverage map: swarms of cargo planes linking your outposts to your main base.

[entity-name]
wp-long-haul-pad=Long haul launch pad

[entity-description]
wp-long-haul-pad=A buffer chest that launches long haul drones to other launch pads, with no range limit. Requests are filled by local robots when they can, and by other pads when they can't.

[item-name]
wp-long-haul-pad=Long haul launch pad
wp-long-haul-drone=Long haul drone

[wp-long-haul]
panel-title=Long haul network
drones-count=Drones: __1__ / __2__
drone-slot-tooltip=Drone slot. Put drones in the pad's inventory to dock them here.\nClick to take a stack out.
requests-hint=Set requests in the logistics section. Anything your local robots can't supply is requested from other pads.
spread=Spread loads
spread-tooltip=Split each delivery across idle drones, so more planes fly.
fill=Fill drones
fill-tooltip=Load every drone up to its weight limit, so fewer trips are needed.
no-drone-requests=Drones dock by hand or inserter, not by request
role-hub=Hub: keeps all its drones
role-outpost=Outpost: keeps __1__ drones, sends the rest home
role-tooltip=A pad becomes a hub for 5 minutes after it supplies another pad. Other pads send extra drones to the nearest hub with free slots.
traffic=Waiting to launch: __1__    Inbound: __2__
effect-payload=Long haul drone payload: __1__ kg
effect-slot=Launch pad drone slots: +1 (__1__ drones)
priority=Priority
priority-tooltip=0 to 255. Pads with higher priority get drones first. Pads with the same priority share drones in turn.
read-stats=Read drone statistics
stat-available=Available drones
stat-at_pad=Drones at this pad
stat-inbound=Inbound drones
stat-network=Total drones in network
power-ok=[color=green]Power: ready[/color]
power-low=[color=red]Low power: deliveries paused[/color]

[mod-setting-name]
wp-long-haul-fancy-flights=Fancy flight paths

[mod-setting-description]
wp-long-haul-fancy-flights=Drones roll down the runway, bank toward their destination and line up with the destination runway to land. Turn off for straight pad-to-pad flights, which are a few seconds quicker.

[virtual-signal-name]
wp-long-haul-drones-available=Available drones
wp-long-haul-drones-total=Drones at this pad
wp-long-haul-drones-inbound=Inbound drones
wp-long-haul-network-drones=Total drones in network

[technology-name]
wp-long-haul-logistics=Long haul logistics
wp-long-haul-cargo-capacity=Long haul cargo capacity

[technology-description]
wp-long-haul-logistics=Launch pads and cargo drones that link logistic networks across any distance. Requests your local robots can't fill are flown in from other pads.
wp-long-haul-cargo-capacity=Bigger drone payloads and more drone slots on every launch pad.
